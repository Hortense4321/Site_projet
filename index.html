<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boutique de Jeux Vidéos</title>

    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Ma Boutique de Jeux Vidéos</h1>
        <p>*jsp quoi mettre là pour le moment*</p>
    </header>

    <main>
        <!-- FORMULAIRE D'AJOUT D'OBJET -->
        <section style="background: white; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2 style="margin-bottom: 1rem; color: #2c3e50;">Ajouter un nouveau jeu</h2>
            
            <form action="" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label for="prod-title" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">Nom du jeu :</label>
                    <input type="text" id="prod-title" name="title" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div>
                    <label for="prod-title" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">Type :</label>
                    <input type="text" id="prod-title" name="title" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div>
                    <label for="prod-desc" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">Description :</label>
                    <textarea id="prod-desc" name="description" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; min-height: 60px;"></textarea>
                </div>
                
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 150px;">
                        <label for="prod-price" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">Prix (€) :</label>
                        <input type="number" id="prod-price" name="price" step="0.01" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                </div>
                
                <button type="submit" style="background-color: #650202; color: white; border: none; padding: 0.7rem; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 0.5rem;">
                    Ajouter à la boutique
                </button>
            </form>
        </section>
        <!-- GRILLE DES PRODUITS -->
        <section class="product-grid">
            <article class="product-card">
                <div class="product-info">
                    <h1 class="description" id="type"> Bac-à-sable </h1>
                    <h2 id="nom">Minecraft</h2>
                    <p class="description" id = "desc">Explorez vos propres mondes uniques, survivez à la nuit et créez tout ce que vous pouvez imaginer !</p>
                    <div class="product-meta">
                        <span id="price" class="price">14,99 €</span>
                        <button class="buy-btn" onclick="alert('Fonctionnalité d\'achat bientôt disponible !')">Ajouter au panier</button>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Boutique de Jeux Vidéos. Tous droits réservés.</p>
    </footer>
</body>
</html>
