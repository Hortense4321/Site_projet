<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boutique de Jeux Vidéos</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js"></script>
  </head>

  <body>
    <header>
      <h1>Ma Boutique de Jeux Vidéos</h1>
      <p>*phrase d'accroche trop cool*</p>
      
      <button
        onclick="reinitialiserDonnees()"
        style="margin-top: 1rem; background: #e23241; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold;"
      >
        Réinitialiser les données
      </button>
    </header>

    <main>
      <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
        <article style="background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <p style="font-size: 0.75rem; font-weight: bold; color: #7f8c8d; text-transform: uppercase;">
            Total Titres
          </p>
          <output id="stat-total" style="display: block; font-size: 1.8rem; font-weight: bold; color: #2c3e50; margin-top: 0.2rem;">
            0
          </output>
        </article>

        <article style="background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <p style="font-size: 0.75rem; font-weight: bold; color: #7f8c8d; text-transform: uppercase;">
            Valeur du Stock
          </p>
          <output id="stat-valeur" style="display: block; font-size: 1.8rem; font-weight: bold; color: #27ae60; margin-top: 0.2rem;">
            0.00 €
          </output>
        </article>

        <article style="background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <p style="font-size: 0.75rem; font-weight: bold; color: #7f8c8d; text-transform: uppercase;">
            Prix Moyen
          </p>
          <output id="stat-moyen" style="display: block; font-size: 1.8rem; font-weight: bold; color: #2980b9; margin-top: 0.2rem;">
            0.00 €
          </output>
        </article>

        <article style="background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <p style="font-size: 0.75rem; font-weight: bold; color: #7f8c8d; text-transform: uppercase;">
            Prix Max / Min
          </p>
          <output id="stat-min-max" style="display: block; font-size: 0.9rem; font-weight: bold; color: #2c3e50; margin-top: 0.5rem;">
            Max: 0€ | Min: 0€
          </output>
        </article>
      </section>

      <section style="display: flex; flex-direction: column; gap: 2rem; margin-bottom: 2rem;">
        
        <!-- 2. Bloc de Filtres -->
        <section style="background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <h2 style="color: #2c3e50; font-size: 1.4rem; margin-bottom: 1rem;">
            Filtres de recherche
          </h2>
          <form onsubmit="return false;" style="display: flex; flex-direction: column; gap: 1rem;">
            <input
              type="search"
              id="recherche-texte"
              oninput="filtrerEtAfficherCatalogue()"
              placeholder="Rechercher par titre ou studio..."
              style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;"
            />

            <select
              id="filtre-generation"
              onchange="filtrerEtAfficherCatalogue()"
              style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; background: #fff;"
            >
              <option value="tous">Toutes les générations</option>
              <option value="Rétro">Rétro (&lt; 2000)</option>
              <option value="Âge d'or">Âge d'or (2000-2015)</option>
              <option value="Moderne">Moderne (&gt;= 2016)</option>
            </select>
          </form>
        </section>

        <!-- 3. Formulaire d'ajout -->
        <section style="background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <h2 style="margin-bottom: 1rem; color: #2c3e50; font-size: 1.4rem;">
            Ajouter un jeu
          </h2>

          <form id="formulaire-jeu" onsubmit="ajouterJeu(event)" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
              <label style="display: block; font-size: 0.8rem; font-weight: bold; color: #555; margin-bottom: 0.3rem;">
                Titre du jeu
              </label>
              <input
                type="text"
                id="champ-titre"
                oninput="verifierSaisieTitre(this)"
                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; outline: none; transition: border 0.2s;"
                placeholder="Ex: Minecraft"
                required
              />
            </div>

            <div>
              <label style="display: block; font-size: 0.8rem; font-weight: bold; color: #555; margin-bottom: 0.3rem;">
                Studio / Développeur
              </label>
              <input
                type="text"
                id="champ-studio"
                style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;"
                placeholder="Ex: Mojang Studios"
                required
              />
            </div>

            <div style="display: flex; gap: 1rem;">
              <div style="flex: 1;">
                <label style="display: block; font-size: 0.8rem; font-weight: bold; color: #555; margin-bottom: 0.3rem;">
                  Année de sortie
                </label>
                <input
                  type="number"
                  id="champ-annee"
                  style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;"
                  placeholder="2011"
                  required
                />
              </div>

              <div style="flex: 1;">
                <label style="display: block; font-size: 0.8rem; font-weight: bold; color: #555; margin-bottom: 0.3rem;">
                  Prix (€)
                </label>
                <input
                  type="number"
                  step="0.01"
                  id="champ-prix"
                  style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;"
                  placeholder="29.99"
                  required
                />
              </div>
            </div>

            <button type="submit" class="add-btn">
              Ajouter au catalogue
            </button>
          </form>
        </section>

      </section>

      <!-- 4. Bloc Titre du Catalogue (Nouveau bloc ajouté en dessous) -->
      <section style="background: white; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 1.5rem;">
        <h2 style="color: #2c3e50; font-size: 1.4rem; margin: 0;">
          Catalogue des Jeux
        </h2>
      </section>

      <!-- 5. Liste des cartes (Grille du catalogue) -->
      <section id="liste-jeux" class="product-grid" aria-label="Liste des jeux vidéo">
        <!-- Les cartes articles seront insérées ici en JavaScript -->
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Boutique de Jeux Vidéos. Tous droits réservés.</p>
    </footer>

  </body>
</html>
