    <header>
        <h1>Ma Boutique de Souvenirs</h1>
        <p>Emportez un morceau de vos plus beaux moments</p>
    </header>

    <main>
        <!-- FORMULAIRE DE MODIFICATION D'OBJET -->
        <section style="background: white; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h2 style="margin-bottom: 1rem; color: #2c3e50;">➕ Modifier un objet</h2>
            
            <form onsubmit="modifierCarte(event);" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 150px;">
                        <label for="prod-id" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">
                            Id de l'objet :
                        </label>
                        <input type="text" id="prod-id" name="id" step="0.01" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                </div>
                <div>
                    <label for="prod-title" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">
                        Nom de l'objet :
                    </label>
                    <input type="text" id="prod-title" name="title" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <div>
                    <label for="prod-desc" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">
                        Description :
                    </label>
                    <textarea id="prod-desc" name="description" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; min-height: 60px;"></textarea>
                </div>
                
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 150px;">
                        <label for="prod-price" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">
                            Prix (€) :
                        </label>
                        <input type="number" id="prod-price" name="price" step="0.01" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                </div>
                
                <button type="submit" style="background-color: #2135a3; color: white; border: none; padding: 0.7rem; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 0.5rem;">
                    Modifier
                </button>
            </form>
        </section>
